name: jobhunter

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobhunter-api:local
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jobhunter-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/readyz',
          timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  jobhunter-data:
