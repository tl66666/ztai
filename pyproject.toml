[project]
name = "jobhunter-ai"
version = "0.1.0"
description = "Browser-first AI career workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "a2wsgi>=1.10,<2",
    "fastapi>=0.115,<1",
    "flask>=2,<4",
    "flask-cors>=4,<7",
    "pdf2docx>=0.5.6,<1",
    "pypdf2>=3,<4",
    "python-multipart>=0.0.20,<1",
    "python-docx>=0.8.11,<2",
    "reportlab>=3.6,<5",
    "requests>=2.28,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
